name: CD

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.push.outputs.digest }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE,DIGEST
          command_timeout: 10m
          script: |
            set -euo pipefail

            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"

            HEALTH_URL="http://localhost:4321/"

            PREVIOUS_DIGEST="$(podman image inspect "${IMAGE}:latest" --format '{{.Digest}}' 2>/dev/null || true)"

            echo "Pulling ${IMAGE}@${DIGEST}"
            podman pull "${IMAGE}@${DIGEST}"

            podman tag "${IMAGE}@${DIGEST}" "${IMAGE}:latest"

            echo "Restarting application"
            systemctl --user restart portfolio

            echo "Waiting for health"
            SERVICE_OK=false
            for _ in $(seq 1 30); do
              if systemctl --user is-active --quiet portfolio \
                && curl -fsS --max-time 2 "$HEALTH_URL" > /dev/null; then
                SERVICE_OK=true
                break
              fi
              sleep 1
            done

            if [ "$SERVICE_OK" = false ]; then
              echo "Deployment failed, dumping diagnostics"
              systemctl --user status portfolio --no-pager --lines 50 || true
              podman logs --tail 50 portfolio || true

              if [ -n "$PREVIOUS_DIGEST" ]; then
                echo "Rolling back to ${PREVIOUS_DIGEST}"
                podman tag "${IMAGE}@${PREVIOUS_DIGEST}" "${IMAGE}:latest"
                systemctl --user restart portfolio
                sleep 5

                if systemctl --user is-active --quiet portfolio && curl -fsS --max-time 5 "$HEALTH_URL" > /dev/null; then
                  echo "Rollback successful, previous version restored"
                else
                  echo "Rollback also failed, service may be down"
                fi
              else
                echo "No previous digest found locally, cannot roll back"
              fi

              exit 1
            fi

            echo "Deployment successful"
            podman image prune -f
